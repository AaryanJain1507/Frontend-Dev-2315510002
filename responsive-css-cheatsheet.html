<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="responsive-css-cheatsheet.css">
</head>
<body>
  <main>
    <section class="cheatsheet">
      <div class="item"><h4>Filters</h4><p>filter: grayscale(100%);</p></div>
      <div class="item"><h4>Media Queries</h4><p>@media (max-width: 900px) { ... }</p></div>
      <div class="item"><h4>Responsive Design</h4><p>Use flexible units, grid, and flexbox.</p></div>
      <div class="item"><h4>Typography</h4><p>font-size: clamp(1rem,2vw,1.5rem);</p></div>
    </section>
  </main>
</body>
</html>
