<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 - Pseudo-Classes Demo</title>
<link rel="stylesheet" href="q1.css">
</head>
<body>
<header><h1>Pseudo-Classes Examples</h1></header>
<main class="row">
<section class="example">
  <a href="#" class="link">Link (:hover)</a>
  <p class="explain">:hover — triggers when pointer is over an element.</p>
</section>
<section class="example">
  <button class="btn">Button (:active / :focus)</button>
  <p class="explain">:active & :focus — active while pressing; focus when keyboard focused.</p>
</section>
<section class="example">
  <ul class="items">
    <li>Item 1</li><li>Item 2</li><li>Item 3</li><li>Item 4</li>
  </ul>
  <p class="explain">:nth-child(odd) — styles alternate list items.</p>
</section>
</main>
</body>
</html>
