<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 - CSS Tooltips</title>
<link rel="stylesheet" href="q2.css">
</head>
<body>
<main class="center">
  <h1>CSS Tooltips (hover)</h1>
  <div class="icons">
    <div class="tool">
      <span class="dot">i</span>
      <span class="tip">This is information tooltip that fades in.</span>
    </div>
    <div class="tool">
      <span class="dot">?</span>
      <span class="tip">Another tooltip positioned above the element.</span>
    </div>
    <div class="tool">
      <span class="dot">⚙️</span>
      <span class="tip">Settings tooltip — pure CSS.</span>
    </div>
  </div>
</main>
</body>
</html>
