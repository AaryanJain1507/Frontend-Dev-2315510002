<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2. Embedded Google Map</title>
</head>
<body>

    <h1>2. Google Map Embed</h1>

    <iframe
        title="Map of New Delhi, India"
        width="600"
        height="450"
        loading="lazy"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d112108.97349191314!2d77.10659160533036!3d28.58782015502663!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfd26c5220c35%3A0x7d2ec3f6b978d33d!2sNew%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1668480000000!5m2!1sen!2sin"
        allowfullscreen=""
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <p>
        <strong>Note on `loading="lazy"`:</strong> This attribute defers loading the map
        until it is about to enter the viewport, improving initial page load performance.
    </p>

</body>
</html>
