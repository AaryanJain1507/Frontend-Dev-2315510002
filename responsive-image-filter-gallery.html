<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header><h1>Image Filter Gallery</h1></header>
  <main>
    <section class="gallery" aria-label="Image filter gallery">
      <figure>
        <img src="https://picsum.photos/id/1015/800/600" alt="Image 1">
        <figcaption>Blur</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1016/800/600" alt="Image 2">
        <figcaption>Grayscale</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1025/800/600" alt="Image 3">
        <figcaption>Sepia</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1035/800/600" alt="Image 4">
        <figcaption>Brightness</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1041/800/600" alt="Image 5">
        <figcaption>Contrast</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1050/800/600" alt="Image 6">
        <figcaption>Hue Rotate</figcaption>
      </figure>
    </section>
  </main>
  <footer>Image Filter Gallery — responsive demo</footer>
</body>
</html>
