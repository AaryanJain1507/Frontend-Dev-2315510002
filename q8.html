<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8 - Box Sizing Comparison</title>
<link rel="stylesheet" href="q8.css">
</head>
<body>
<main class="center">
  <h1>box-sizing Comparison</h1>
  <div class="compare">
    <div class="box default">
      <p>default box-sizing<br>width:200px + padding</p>
    </div>
    <div class="box borderbox">
      <p>border-box<br>padding included in width</p>
    </div>
  </div>
  <p class="explain">The left uses the default content-box; the right uses <code>box-sizing:border-box</code>.</p>
</main>
</body>
