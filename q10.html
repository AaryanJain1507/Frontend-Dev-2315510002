<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>10. Contact Form</title>
</head>
<body>

    <h1>10. Contact Us</h1>

    <form action="#" method="post">
        <p>
            <label for="name">Full Name:</label>
            <br>
            <input
                type="text"
                id="name"
                name="full_name"
                placeholder="Enter your full name"
                required>
        </p>

        <p>
            <label for="email">Email:</label>
            <br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required>
        </p>

        <p>
            <label for="subject">Subject:</label>
            <br>
            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Briefly state your reason for contact"
                required>
        </p>

        <p>
            <label for="message">Message:</label>
            <br>
            <textarea
                id="message"
                name="message"
                rows="6"
                cols="40"
                placeholder="Write your message here..."
                required></textarea>
        </p>

        <p>
            <button type="submit">Send Message</button>
        </p>
    </form>

</body>
</html>
