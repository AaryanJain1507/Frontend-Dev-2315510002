<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3. Stacked Iframes</title>
</head>
<body>

    <h1>3. Introduction and Hobby Pages (in Iframes)</h1>

    <h2>My Introduction</h2>
    <iframe
        width="500"
        height="250"
        title="My Introduction Page"
        srcdoc="
            <h3 style='font-family: sans-serif;'>Hello!</h3>
            <p style='font-family: sans-serif;'>I am Barkha Sharma.</p>
        "
        frameborder="1">
    </iframe>

    <h2>My Favorite Hobby</h2>
    <iframe
        width="500"
        height="250"
        title="My Favorite Hobby Page"
        srcdoc="
            <h3 style='font-family: sans-serif;'>Reading</h3>
            <p style='font-family: sans-serif;'>My favorite hobby is Netflix and chill.</p>
        "
        frameborder="1">
    </iframe>

</body>
</html>
