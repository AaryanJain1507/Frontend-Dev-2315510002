<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Responsive Design Principles</title>
  <link rel="stylesheet" href="responsive-principles-summary.css">
</head>
<body>
  <main class="principles">
    <section class="box">
      <h3>Fluid Layouts</h3>
      <p>Use percentages and flexible units to create fluid layouts.</p>
      <pre><code>width:100%;max-width:1200px;</code></pre>
    </section>
    <section class="box">
      <h3>Flexible Media</h3>
      <p>Make media scale with container width.</p>
      <pre><code>img{max-width:100%;height:auto;}</code></pre>
    </section>
    <section class="box">
      <h3>Breakpoints</h3>
      <p>Use media queries to adjust layout across screen sizes.</p>
      <pre><code>@media (max-width:900px){...}</code></pre>
    </section>
  </main>
</body>
</html>
