<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Dropdown Selection</title></head>
<body>
<h1>Travel Selection</h1>
<form>
<label>Country: <select><option selected>India</option><option>USA</option></select></label><br>
<label>State: <select><option selected>Uttar Pradesh</option><option>Delhi</option></select></label><br>
<label>City: <select><option selected>Agra</option><option>Mathura</option></select></label><br>
<label>Place: <select><option selected>Taj Mahal</option><option>Red Fort</option></select></label>
</form>
<p>You chose Agra, Uttar Pradesh, India - Taj Mahal</p>
</body></html>
